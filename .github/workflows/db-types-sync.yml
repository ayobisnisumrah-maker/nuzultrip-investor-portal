name: Sync Database Types (manual)

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for regenerating database types'
        required: false
        default: 'Synchronize generated types with committed migrations'
        type: string

permissions:
  contents: write
  actions: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: latest
          github-token: ${{ github.token }}

      - name: Start local Supabase from migrations
        run: supabase start

      - name: Reset local schema
        run: supabase db reset

      - name: Regenerate database types
        run: pnpm db:types

      - name: Commit synchronized types
        shell: bash
        run: |
          if git diff --quiet -- src/types/database.ts; then
            echo "Database types are already synchronized."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/types/database.ts
          git commit -m "chore: sync generated database types"
          git push origin HEAD:main

      - name: Verify CI against synchronized main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref main

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
