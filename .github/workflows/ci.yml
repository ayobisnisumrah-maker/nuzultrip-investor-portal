name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Dependency audit
        run: pnpm audit --prod --audit-level high

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: latest
          github-token: ${{ github.token }}

      - name: Diagnose Docker and Supabase ports
        run: |
          docker ps -a
          echo "=== PORT 54322 ==="
          sudo ss -ltnp | grep 54322 || true
          echo "=== PORT 54320 ==="
          sudo ss -ltnp | grep 54320 || true
          echo "=== DOCKER NETWORKS ==="
          docker network ls

      - name: Start local Supabase
        run: supabase start

      - name: Reset local schema from migrations
        run: supabase db reset

      - name: Verify generated database types
        run: pnpm db:types --check

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Database and RLS integration tests
        run: pnpm test:db:only --no-file-parallelism

      - name: Production build
        shell: bash
        run: |
          set -euo pipefail
          eval "$(supabase status -o env)"
          export NEXT_PUBLIC_SUPABASE_URL="$API_URL"
          export NEXT_PUBLIC_SUPABASE_ANON_KEY="${ANON_KEY:-${PUBLISHABLE_KEY:-ci-public-key-placeholder-1234567890}}"
          export NEXT_PUBLIC_SITE_URL="http://localhost:3000"
          export NEXT_PUBLIC_APP_ENV="staging"
          export SUPABASE_SERVICE_ROLE_KEY="${SERVICE_ROLE_KEY:-${SECRET_KEY:-ci-service-role-placeholder-1234567890}}"
          export AUDIT_IP_SALT="ci-audit-ip-salt-1234567890"
          export IDENTITY_HASH_SALT="ci-identity-hash-salt-1234567890"
          pnpm build
