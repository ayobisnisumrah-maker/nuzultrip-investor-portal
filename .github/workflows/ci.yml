name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Dependency audit
        run: pnpm audit --prod --audit-level high

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: latest
          github-token: ${{ github.token }}

      - name: Diagnose Docker and Supabase ports
        run: |
          docker ps -a
          echo "=== PORT 54322 ==="
          sudo ss -ltnp | grep 54322 || true
          echo "=== PORT 54320 ==="
          sudo ss -ltnp | grep 54320 || true
          echo "=== DOCKER NETWORKS ==="
          docker network ls

      - name: Start local Supabase
        run: supabase start

      - name: Export local build environment
        run: |
          status_env="$(supabase status -o env)"
          api_url="$(printf '%s\n' "$status_env" | sed -n 's/^API_URL="\(.*\)"$/\1/p')"
          publishable_key="$(printf '%s\n' "$status_env" | sed -n 's/^PUBLISHABLE_KEY="\(.*\)"$/\1/p')"
          test -n "$api_url"
          test -n "$publishable_key"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$api_url"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$publishable_key"
            echo "NEXT_PUBLIC_SITE_URL=http://localhost:3000"
            echo "NEXT_PUBLIC_APP_ENV=development"
          } >> "$GITHUB_ENV"

      - name: Reset local schema from migrations
        run: supabase db reset

      - name: Verify generated database types
        run: pnpm db:types --check

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Database and RLS integration tests
        run: pnpm test:db:only --no-file-parallelism

      - name: Production build
        run: pnpm build
