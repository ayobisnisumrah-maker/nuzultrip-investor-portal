name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Dependency audit
        run: pnpm audit --prod --audit-level high

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: latest
          github-token: ${{ github.token }}

      - name: Diagnose Docker and Supabase ports
        run: |
          docker ps -a
          echo "=== PORT 54322 ==="
          sudo ss -ltnp | grep 54322 || true
          echo "=== PORT 54320 ==="
          sudo ss -ltnp | grep 54320 || true
          echo "=== DOCKER NETWORKS ==="
          docker network ls

      - name: Start local Supabase
        run: supabase start

      - name: Export local build environment
        run: |
          status_env="$(supabase status -o env)"
          api_url="$(printf '%s\n' "$status_env" | sed -n 's/^API_URL="\(.*\)"$/\1/p')"
          publishable_key="$(printf '%s\n' "$status_env" | sed -n 's/^PUBLISHABLE_KEY="\(.*\)"$/\1/p')"
          test -n "$api_url"
          test -n "$publishable_key"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$api_url"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$publishable_key"
            echo "NEXT_PUBLIC_SITE_URL=http://localhost:3000"
            echo "NEXT_PUBLIC_APP_ENV=development"
          } >> "$GITHUB_ENV"

      - name: Reset local schema from migrations
        run: supabase db reset

      - name: Generate exact database types
        run: pnpm db:types

      - name: Sync generated types and scheduled function contract
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.head_ref }}
          REPOSITORY: ${{ github.repository }}
        run: |
          node <<'NODE'
          const fs = require('fs')
          const { execFileSync } = require('child_process')

          const token = process.env.GH_TOKEN
          const branch = process.env.HEAD_BRANCH
          const repo = process.env.REPOSITORY
          if (!token || !branch || !repo) throw new Error('Missing GitHub sync context.')

          function api(method, path, body) {
            const args = [
              '-fsSL', '-X', method,
              '-H', `Authorization: Bearer ${token}`,
              '-H', 'Accept: application/vnd.github+json',
              '-H', 'X-GitHub-Api-Version: 2022-11-28',
            ]
            if (body) args.push('-H', 'Content-Type: application/json', '--data-binary', JSON.stringify(body))
            args.push(`https://api.github.com/repos/${repo}${path}`)
            return JSON.parse(execFileSync('curl', args, { encoding: 'utf8' }))
          }

          function putFile(path, content, message) {
            const current = api('GET', `/contents/${path}?ref=${encodeURIComponent(branch)}`)
            const currentText = Buffer.from(current.content, 'base64').toString('utf8')
            if (currentText === content) return false
            api('PUT', `/contents/${path}`, {
              message,
              content: Buffer.from(content, 'utf8').toString('base64'),
              sha: current.sha,
              branch,
            })
            return true
          }

          const types = fs.readFileSync('src/types/database.ts', 'utf8')
          const typesChanged = putFile(
            'src/types/database.ts',
            types,
            'chore(db): regenerate retention database types',
          )

          let config = fs.readFileSync('supabase/config.toml', 'utf8')
          const functionHeader = '[functions.purge-rejected-investors]'
          if (!config.includes(functionHeader)) {
            if (!config.endsWith('\n')) config += '\n'
            config += `\n${functionHeader}\nverify_jwt = false\n`
          }
          const configChanged = putFile(
            'supabase/config.toml',
            config,
            'fix(retention): allow Vault-authenticated purge scheduler',
          )

          console.log(JSON.stringify({ typesChanged, configChanged }))
          NODE

      - name: Stop after contract sync
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: exit 1

      - name: Verify generated database types
        run: pnpm db:types --check

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Database and RLS integration tests
        run: pnpm test:db:only --no-file-parallelism

      - name: Production build
        run: pnpm build
