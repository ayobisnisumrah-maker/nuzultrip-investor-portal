name: Temporary Database Type Sync

on:
  push:
    branches:
      - feat/dashboard-cashflow-summary

permissions:
  contents: write

jobs:
  sync-types:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/dashboard-cashflow-summary
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: latest

      - name: Start local Supabase
        env:
          SUPABASE_INTERNAL_IMAGE_REGISTRY: ghcr.io
        run: supabase start

      - name: Generate database types
        run: pnpm db:types

      - name: Commit generated types when changed
        run: |
          if git diff --quiet -- src/types/database.ts; then
            echo "Generated database types are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/types/database.ts
          git commit -m "chore(db): regenerate database types"
          git push origin HEAD:feat/dashboard-cashflow-summary

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
