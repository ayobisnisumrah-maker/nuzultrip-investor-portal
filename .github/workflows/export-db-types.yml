name: Export DB Types

on:
  push:
    branches: [feat/refund-policy-terms-letterhead]

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/refund-policy-terms-letterhead
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: supabase/setup-cli@v2
        with:
          version: latest
      - run: supabase start
      - run: supabase db reset
      - run: pnpm db:types
      - name: Commit generated database types
        shell: bash
        run: |
          if git diff --quiet -- src/types/database.ts; then
            echo "database.ts is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/types/database.ts
          git commit -m "chore(db): regenerate database types"
          git push origin HEAD:feat/refund-policy-terms-letterhead
