name: Governance DB Types Artifact

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: latest
          github-token: ${{ github.token }}

      - name: Start local Supabase
        run: supabase start

      - name: Reset local schema
        run: supabase db reset

      - name: Generate database types
        run: pnpm db:types

      - name: Commit generated database types
        shell: bash
        run: |
          if git diff --quiet -- src/types/database.ts; then
            echo "Database types are already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/types/database.ts
          git commit -m "chore: sync governance database types"
          git push origin HEAD:${GITHUB_HEAD_REF}

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
