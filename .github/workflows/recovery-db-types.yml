name: Recovery DB Types

on:
  push:
    branches:
      - share-sale-recovery-20260906
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@v4
        with:
          ref: share-sale-recovery-20260906

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: latest
          github-token: ${{ github.token }}

      - name: Start local Supabase
        run: supabase start

      - name: Reset schema from migrations
        run: supabase db reset

      - name: Regenerate committed database types
        run: pnpm db:types

      - name: Commit generated types
        run: |
          if git diff --quiet -- src/types/database.ts; then
            echo 'Database types already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/types/database.ts
          git commit -m 'chore: regenerate database types for share sale workflow'
          git push origin HEAD:share-sale-recovery-20260906
