name: Sync Database Types

# Intentionally disabled.
# Database types are generated and verified by the main CI gate.
# Keeping CI read-only avoids a race where an auto-commit changes main while
# the original push is still being verified.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disabled:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Database type synchronization is CI-gated; update generated types in the same change as migrations."
