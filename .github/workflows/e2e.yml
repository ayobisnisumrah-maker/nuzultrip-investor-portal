name: Browser E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - project: chromium
            browser: chromium
          - project: firefox
            browser: firefox
          - project: webkit
            browser: webkit
          - project: edge
            browser: msedge
          - project: tablet-chrome
            browser: chromium
          - project: mobile-chrome
            browser: chromium
          - project: mobile-safari
            browser: webkit

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: latest
          github-token: ${{ github.token }}

      - name: Start local Supabase
        run: supabase start

      - name: Export isolated E2E environment
        run: |
          status_env="$(supabase status -o env)"
          api_url="$(printf '%s\n' "$status_env" | sed -n 's/^API_URL="\(.*\)"$/\1/p')"
          publishable_key="$(printf '%s\n' "$status_env" | sed -n 's/^PUBLISHABLE_KEY="\(.*\)"$/\1/p')"
          service_role_key="$(printf '%s\n' "$status_env" | sed -n 's/^SERVICE_ROLE_KEY="\(.*\)"$/\1/p')"
          test -n "$api_url"
          test -n "$publishable_key"
          test -n "$service_role_key"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$api_url"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$publishable_key"
            echo "SUPABASE_SERVICE_ROLE_KEY=$service_role_key"
            echo "NEXT_PUBLIC_SITE_URL=http://127.0.0.1:3000"
            echo "NEXT_PUBLIC_APP_ENV=development"
            echo "SUPABASE_AUTH_HOOK_SECRET=e2e-auth-hook-secret-local-only"
            echo "AUDIT_IP_SALT=6f33299517cadb1bded2ccb48c0764b185cb6b188c99640f19d7a72c60a841c3"
            echo "IDENTITY_HASH_SALT=c4aa61f340d5735ae0a9de8a2cb2c1407290865956abe88cbd6d8595f1755f38"
          } >> "$GITHUB_ENV"

      - name: Reset local schema from migrations
        run: supabase db reset

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps ${{ matrix.browser }}

      - name: Run browser acceptance suite
        run: pnpm test:e2e -- --project=${{ matrix.project }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report/
          retention-days: 14
          if-no-files-found: ignore

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
